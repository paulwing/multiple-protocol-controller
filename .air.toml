root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # cmd = "go build -o ./tmp/main ./cmd 2>&1 | sed -e 's/^/\x1b[31m/' -e 's/$/\x1b[0m/'"
  cmd = "bash -c 'go build -o ./tmp/main ./cmd 2>&1 | sed -e \"/error/s/^/$(printf \"\\033[1;31m\")/\" -e \"s/$/$(printf \"\\033[0m\")/\"'"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "logs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "yaml", "toml", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
